[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-financeira"
version = "0.1.0"
description = "Agente de IA financeira local (Ollama) com busca na web e guardrails de risco"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
mt5 = ["MetaTrader5>=5.0.45"]

[project.scripts]
ia-financeira = "ia_financeira.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
